[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shellac"
version = "2.0.0"
description = "A tag- and weight-based music player"
readme = "README.txt"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "qt-material>=2.14",
    "tinytag>=2.0",
    "yt-dlp>=2025.1",
    "imageio-ffmpeg>=0.5",
    "platformdirs>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6"]

[project.gui-scripts]
shellac = "shellac.__main__:main"

[tool.setuptools]
packages = ["shellac", "shellac.core", "shellac.playback", "shellac.download", "shellac.ui", "shellac.ui.dialogs", "shellac.ui.widgets"]

[tool.setuptools.package-data]
shellac = ["assets/*", "default_config.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
