[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "shellac"
version = "1.1.0"
description = "A tag- and weight-based music player"
readme = "README.txt"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.5",
    "qt-material>=2.14",
    "tinytag>=1.9",
    "keyboard>=0.13.5",
    "you-get>=0.4.1650",
    "pyffmpeg>=2.4.2",
    "platformdirs>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff>=0.6", "pyinstaller>=6"]

[project.gui-scripts]
shellac = "shellac.__main__:main"

[tool.setuptools]
packages = ["shellac"]

[tool.setuptools.package-data]
shellac = ["assets/*", "styles/*", "default_config.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["shellac/app.py"]
